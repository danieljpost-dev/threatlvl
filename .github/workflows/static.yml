# Build the Zola site and deploy it to GitHub Pages.
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Zola
        run: |
          set -euo pipefail
          url="https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location "$url" -o zola.tar.gz
          tar -xzf zola.tar.gz
          install -m 0755 zola /usr/local/bin/zola
          zola --version

      # base_url comes from config.toml so the canonical domain is used, not the
      # *.github.io fallback. sass/_variables.scss is committed (vendored from the
      # private shared-css repo), so nothing private is needed at build time.
      - name: Build
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
